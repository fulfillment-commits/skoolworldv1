<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setterlun Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Setterlun Admin</h1>
      <p class="text-gray-500 mt-2">Sign in to access the dashboard</p>
    </div>

    <div id="status" class="mb-4 text-center text-sm min-h-[24px]"></div>

    <form id="adminLoginForm">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-blue-500">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-blue-500">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium transition">
        Login as Admin
      </button>
    </form>
  </div>

<script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('status');

      statusEl.innerHTML = '<span class="text-blue-600">Logging in...</span>';

      try {
        const res = await fetch('/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Save token in BOTH localStorage and cookie (most important)
          localStorage.setItem('adminToken', data.token);
          
          // Set cookie that browser will send automatically
          document.cookie = `adminToken=${data.token}; path=/; max-age=604800`; // 7 days

          statusEl.innerHTML = '<span class="text-green-600">Login successful! Redirecting...</span>';

          setTimeout(() => {
            window.location.replace('/');   // Use replace
          }, 1000);

        } else {
          statusEl.innerHTML = `<span class="text-red-600">${data.message || 'Invalid credentials'}</span>`;
        }
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = `<span class="text-red-600">Connection error.</span>`;
      }
    });
  </script></body>
</html>
