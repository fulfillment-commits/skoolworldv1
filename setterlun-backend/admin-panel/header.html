<div class="px-8 py-5 flex justify-between items-center">
  <h2 id="pageTitle" class="text-2xl font-semibold text-gray-800">Dashboard</h2>
  
  <div class="flex items-center gap-6">
    <button onclick="loadUsers()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition">
      <i class="fas fa-sync"></i> Refresh
    </button>

    <!-- User Menu -->
    <div class="relative" id="userMenu">
      <button onclick="toggleUserMenu()" 
              class="flex items-center gap-3 hover:bg-gray-100 px-3 py-2 rounded-lg transition">
        <span class="text-sm text-gray-600" id="adminName">Admin</span>
        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold" id="adminInitial">
          A
        </div>
      </button>

      <!-- Dropdown Menu -->
      <div id="userDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-gray-200 py-1 z-50">
        <div class="px-4 py-3 border-b">
          <p class="text-sm font-medium text-gray-900" id="dropdownName">Admin</p>
          <p class="text-xs text-gray-500" id="dropdownEmail">admin@setterlun.com</p>
        </div>
        
        <a href="#" onclick="logoutAdmin()" 
           class="flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-gray-100 transition">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </div>
  </div>
</div>
