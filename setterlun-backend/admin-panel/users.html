<div class="bg-white rounded-2xl shadow-sm overflow-hidden">
  <div class="px-8 py-6 border-b flex justify-between items-center">
    <h3 class="text-xl font-semibold">All Users</h3>
    
    <div class="flex items-center gap-4">
      <div class="text-sm text-gray-500" id="userCount">0 users</div>
      <button onclick="showAddUserModal()" 
              class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg flex items-center gap-2 transition">
        <i class="fas fa-plus"></i> Add New User
      </button>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full">
      <thead>
        <tr class="bg-gray-50">
          <th class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
          <th class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Full Name</th>
          <th class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Username</th>
          <th class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
          <th class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Phone</th>
          <th class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Joined</th>
          <th class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody" class="divide-y bg-white">
        <!-- Filled dynamically by JS -->
      </tbody>
    </table>
  </div>
</div>

<!-- Add User Modal -->
<div id="addUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4">
    <div class="px-6 py-4 border-b flex justify-between items-center">
      <h3 class="text-lg font-semibold">Add New User</h3>
      <button onclick="hideAddUserModal()" class="text-gray-400 hover:text-gray-600">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input id="newFullName" type="text" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input id="newUsername" type="text" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="newEmail" type="email" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input id="newPassword" type="password" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <div class="px-6 py-4 border-t flex justify-end gap-3">
      <button onclick="hideAddUserModal()" 
              class="px-5 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
      <button onclick="addNewUser()" 
              class="px-5 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Create User</button>
    </div>
  </div>
</div>
