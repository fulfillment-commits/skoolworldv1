<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setterlun Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100">

  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div id="sidebar" class="w-64 bg-gray-900 text-white flex flex-col"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col">

      <!-- Header -->
      <div id="header" class="bg-white shadow-sm border-b"></div>

      <!-- Page Content -->
      <div id="content" class="flex-1 overflow-auto p-8"></div>

      <!-- Footer -->
      <div id="footer" class="bg-white border-t py-4 px-8 text-center text-sm text-gray-500"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
