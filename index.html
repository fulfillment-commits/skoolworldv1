<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Setterlun University World</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="screen-orientation" content="landscape">
    <meta name="orientation" content="landscape">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050510;
        color: #f6ead0;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050510;
      }

      #unity-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #050510;
        outline: 0;
      }

      #portal-unity-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background:
          radial-gradient(circle at 50% 38%, rgba(212, 175, 55, 0.14), transparent 34%),
          linear-gradient(180deg, #09090b 0%, #050510 100%);
      }

      .portal-loader-panel {
        width: min(420px, 100%);
        text-align: center;
      }

      .portal-loader-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid rgba(212, 175, 55, 0.34);
        border-radius: 999px;
        color: #d4af37;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: rgba(212, 175, 55, 0.07);
      }

      .portal-loader-title {
        margin-top: 22px;
        color: #fff7df;
        font-size: clamp(28px, 6vw, 48px);
        line-height: 1;
        font-weight: 800;
      }

      .portal-loader-subtitle {
        margin-top: 12px;
        color: rgba(246, 234, 208, 0.66);
        font-size: 14px;
        line-height: 1.5;
      }

      .portal-loader-track {
        width: 100%;
        height: 10px;
        margin-top: 28px;
        overflow: hidden;
        border: 1px solid rgba(212, 175, 55, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      #portal-loader-bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #d4af37, #ffe08a);
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.38);
        transition: width 160ms ease;
      }

      #portal-loader-percent {
        margin-top: 12px;
        color: rgba(246, 234, 208, 0.72);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      #unity-warning {
        position: fixed;
        top: 16px;
        left: 50%;
        z-index: 1001;
        width: min(560px, calc(100% - 32px));
        transform: translateX(-50%);
        color: #09090b;
        font-size: 13px;
        text-align: center;
      }

      #unity-rotation-message {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.92);
        color: #fff;
        text-align: center;
      }

      #unity-rotation-message.unity-visible {
        display: flex;
      }

      .unity-rotation-panel {
        max-width: 360px;
      }

      .unity-rotation-icon {
        margin-bottom: 18px;
        font-size: 42px;
        line-height: 1;
      }

      .unity-rotation-title {
        margin-bottom: 10px;
        font-size: 20px;
        font-weight: 800;
      }

      .unity-rotation-text {
        margin-bottom: 18px;
        color: #d9e4ff;
        font-size: 15px;
        line-height: 1.45;
      }

      .unity-rotation-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: #d4af37;
        color: #050510;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
      }

      @media (pointer: coarse) {
        * {
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
        }

        body {
          position: fixed;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-rotation-message" aria-live="polite">
      <div class="unity-rotation-panel">
        <div class="unity-rotation-icon">Rotate</div>
        <div class="unity-rotation-title">Rotate Your Device</div>
        <div class="unity-rotation-text">This experience works best in landscape mode.</div>
        <button id="unity-enable-rotation" class="unity-rotation-button" type="button">Enable Auto-Rotation</button>
      </div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-warning"></div>
    </div>

    <div id="portal-unity-loader">
      <div class="portal-loader-panel">
        <div class="portal-loader-mark">Setterlun University</div>
        <div class="portal-loader-title">Entering the World</div>
        <div class="portal-loader-subtitle">Preparing your campus, quests, and multiplayer session.</div>
        <div class="portal-loader-track">
          <div id="portal-loader-bar"></div>
        </div>
        <div id="portal-loader-percent">0%</div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var portalLoader = document.querySelector("#portal-unity-loader");
      var portalLoaderBar = document.querySelector("#portal-loader-bar");
      var portalLoaderPercent = document.querySelector("#portal-loader-percent");
      var warningBanner = document.querySelector("#unity-warning");
      var rotationMessage = document.querySelector("#unity-rotation-message");
      var enableRotationButton = document.querySelector("#unity-enable-rotation");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var isAndroid = /Android/.test(navigator.userAgent);
      var lastWindowHeight = window.innerHeight;
      var rotationAttempted = false;
      var pendingPortalMessages = [];

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.padding = "10px";
        div.style.borderRadius = "8px";
        div.style.background = type === "error" ? "#ef4444" : type === "warning" ? "#facc15" : "#d4af37";
        warningBanner.appendChild(div);

        if (type !== "error") {
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      function notifyPortal(type, payload) {
        if (!window.parent || window.parent === window) {
          return;
        }

        window.parent.postMessage({
          source: "setterlun-unity",
          type: type,
          payload: payload || {}
        }, "*");
      }

      function forwardPortalMessageToUnity(data) {
        var json = JSON.stringify(data);
        if (window.unityInstance && window.unityInstance.SendMessage) {
          window.unityInstance.SendMessage("BackendRunner", "OnPortalMessage", json);
          return;
        }

        pendingPortalMessages.push(json);
      }

      function flushPortalMessages() {
        if (!window.unityInstance || !window.unityInstance.SendMessage) {
          return;
        }

        while (pendingPortalMessages.length) {
          window.unityInstance.SendMessage("BackendRunner", "OnPortalMessage", pendingPortalMessages.shift());
        }
      }

      window.addEventListener("message", function(event) {
        var data = event.data;
        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            return;
          }
        }

        if (!data || data.source !== "setterlun-portal") {
          return;
        }

        forwardPortalMessageToUnity(data);
      });

      function isLandscapeOrientation() {
        return window.orientation === 90 ||
          window.orientation === -90 ||
          (screen.orientation && Math.abs(screen.orientation.angle) === 90) ||
          window.innerWidth > window.innerHeight;
      }

      function showRotationMessage(canRequestRotation) {
        if (!rotationMessage) {
          return;
        }

        rotationMessage.classList.add("unity-visible");
        if (enableRotationButton) {
          enableRotationButton.style.display = canRequestRotation ? "inline-flex" : "none";
        }

        container.style.filter = "blur(3px)";
        container.style.pointerEvents = "none";
      }

      function hideRotationMessage() {
        if (rotationMessage) {
          rotationMessage.classList.remove("unity-visible");
        }

        container.style.filter = "none";
        container.style.pointerEvents = "auto";
      }

      function attemptOrientationLock() {
        if (!isMobile || !screen.orientation || !screen.orientation.lock) {
          return Promise.reject(new Error("Screen orientation lock is not supported."));
        }

        var requestLock = function() {
          return screen.orientation.lock("landscape-primary")
            .catch(function() {
              return screen.orientation.lock("landscape");
            })
            .catch(function() {
              return screen.orientation.lock("landscape-secondary");
            });
        };

        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          return document.documentElement.requestFullscreen()
            .catch(function() {})
            .then(requestLock);
        }

        return requestLock();
      }

      function requestUserInteractionForRotation() {
        rotationAttempted = true;
        attemptOrientationLock()
          .then(function() {
            setTimeout(handleOrientationChange, 250);
          })
          .catch(function() {
            showRotationMessage(false);
          });
      }

      function hideAddressBar() {
        if (!isMobile) {
          return;
        }

        try {
          window.scrollTo(0, 1);
          if (isIOS) {
            setTimeout(function() {
              window.scrollTo(0, 0);
            }, 100);
          }
          if (isAndroid) {
            setTimeout(function() {
              window.scrollTo(0, 1);
            }, 300);
          }
        } catch (error) {}
      }

      function resizeUnityCanvas() {
        if (!canvas || !container) {
          return;
        }

        canvas.style.width = "100%";
        canvas.style.height = "100%";
        container.style.width = "100%";
        container.style.height = "100%";
      }

      function handleOrientationChange() {
        if (!isMobile) {
          return;
        }

        if (isLandscapeOrientation()) {
          hideRotationMessage();
          setTimeout(function() {
            hideAddressBar();
            resizeUnityCanvas();
          }, 200);
          return;
        }

        if (!isIOS && !rotationAttempted && screen.orientation && screen.orientation.lock) {
          rotationAttempted = true;
          attemptOrientationLock()
            .then(function() {
              setTimeout(handleOrientationChange, 250);
            })
            .catch(function() {
              showRotationMessage(true);
            });
          return;
        }

        showRotationMessage(!isIOS && !!(screen.orientation && screen.orientation.lock));
      }

      function preventMobileBehaviors() {
        if (!isMobile) {
          return;
        }

        document.addEventListener("contextmenu", function(event) {
          event.preventDefault();
        }, { passive: false });

        var lastTouchEnd = 0;
        document.addEventListener("touchend", function(event) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });
      }

      resizeUnityCanvas();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        dataUrl: buildUrl + "/build.data",
        frameworkUrl: buildUrl + "/build.framework.js",
        codeUrl: buildUrl + "/build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Setterlun_University_OnBoarding",
        productVersion: "0.1",
        showBanner: unityShowBanner
      };

      if (isMobile) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        preventMobileBehaviors();
        setTimeout(handleOrientationChange, 500);
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          var percent = Math.round(progress * 100);
          if (portalLoaderBar) {
            portalLoaderBar.style.width = percent + "%";
          }
          if (portalLoaderPercent) {
            portalLoaderPercent.textContent = percent + "%";
          }
        }).then(function(unityInstance) {
          window.unityInstance = unityInstance;
          if (portalLoader) {
            portalLoader.style.display = "none";
          }

          resizeUnityCanvas();
          flushPortalMessages();
          notifyPortal("unity.ready", {
            productName: "Setterlun_University_OnBoarding",
            productVersion: "0.1"
          });

          if (isMobile) {
            setTimeout(function() {
              resizeUnityCanvas();
              hideAddressBar();
              handleOrientationChange();
            }, 500);
          }
        }).catch(function(message) {
          alert(message);
        });
      };

      document.body.appendChild(script);

      if (enableRotationButton) {
        enableRotationButton.onclick = requestUserInteractionForRotation;
      }

      window.addEventListener("resize", function() {
        setTimeout(function() {
          if (isMobile && Math.abs(window.innerHeight - lastWindowHeight) > 50) {
            hideAddressBar();
          }
          lastWindowHeight = window.innerHeight;
          resizeUnityCanvas();
          handleOrientationChange();
        }, 100);
      });

      if (isMobile) {
        window.addEventListener("orientationchange", function() {
          setTimeout(handleOrientationChange, 250);
        });

        window.addEventListener("focus", function() {
          setTimeout(handleOrientationChange, 250);
        });

        document.addEventListener("visibilitychange", function() {
          if (!document.hidden) {
            setTimeout(handleOrientationChange, 250);
          }
        });

        document.addEventListener("touchstart", function() {
          setTimeout(hideAddressBar, 300);
        }, { passive: true });
      }
    </script>
  </body>
</html>
