<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="screen-orientation" content="landscape">
    <meta name="orientation" content="landscape">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      #unity-rotation-message {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.92);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      #unity-rotation-message.unity-visible {
        display: flex;
      }

      .unity-rotation-panel {
        max-width: 360px;
      }

      .unity-rotation-icon {
        font-size: 48px;
        line-height: 1;
        margin-bottom: 18px;
      }

      .unity-rotation-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .unity-rotation-text {
        font-size: 15px;
        line-height: 1.45;
        color: #d9e4ff;
        margin-bottom: 18px;
      }

      .unity-rotation-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: #1677ff;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      @media (pointer: coarse) {
        * {
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
        }

        body {
          overflow: hidden;
          position: fixed;
          width: 100%;
          height: 100%;
        }
      }
    </style>

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-rotation-message" aria-live="polite">
      <div class="unity-rotation-panel">
        <div class="unity-rotation-icon">Rotate</div>
        <div class="unity-rotation-title">Rotate Your Device</div>
        <div class="unity-rotation-text">This experience works best in landscape mode.</div>
        <button id="unity-enable-rotation" class="unity-rotation-button" type="button">Enable Auto-Rotation</button>
      </div>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="unity-theme-toggle" type="button" aria-pressed="false" title="Toggle night mode">Night</button>
#if SHOW_DIAGNOSTICS
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var themeToggleButton = document.querySelector("#unity-theme-toggle");
      var warningBanner = document.querySelector("#unity-warning");
      var rotationMessage = document.querySelector("#unity-rotation-message");
      var enableRotationButton = document.querySelector("#unity-enable-rotation");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var isAndroid = /Android/.test(navigator.userAgent);
      var lastWindowHeight = window.innerHeight;
      var rotationAttempted = false;
#if SHOW_DIAGNOSTICS
      var diagnostics_icon = document.getElementById("diagnostics-icon");
#endif

      function setTemplateTheme(mode) {
        var isNight = mode === "night";
        document.body.classList.toggle("unity-night-mode", isNight);
        themeToggleButton.textContent = isNight ? "Default" : "Night";
        themeToggleButton.setAttribute("aria-pressed", isNight ? "true" : "false");

        try {
          localStorage.setItem("unity-template-theme", isNight ? "night" : "default");
        } catch (e) {}
      }

      var savedTheme = "default";
      try {
        savedTheme = localStorage.getItem("unity-template-theme") || "default";
      } catch (e) {}
      setTemplateTheme(savedTheme === "night" ? "night" : "default");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function isLandscapeOrientation() {
        return window.orientation === 90 ||
          window.orientation === -90 ||
          (screen.orientation && Math.abs(screen.orientation.angle) === 90) ||
          window.innerWidth > window.innerHeight;
      }

      function showRotationMessage(canRequestRotation) {
        if (!rotationMessage) {
          return;
        }

        rotationMessage.classList.add("unity-visible");
        if (enableRotationButton) {
          enableRotationButton.style.display = canRequestRotation ? "inline-flex" : "none";
        }

        container.style.filter = "blur(3px)";
        container.style.pointerEvents = "none";
      }

      function hideRotationMessage() {
        if (rotationMessage) {
          rotationMessage.classList.remove("unity-visible");
        }

        container.style.filter = "none";
        container.style.pointerEvents = "auto";
      }

      function attemptOrientationLock() {
        if (!isMobile || !screen.orientation || !screen.orientation.lock) {
          return Promise.reject(new Error("Screen orientation lock is not supported."));
        }

        var requestLock = function() {
          return screen.orientation.lock("landscape-primary")
            .catch(function() {
              return screen.orientation.lock("landscape");
            })
            .catch(function() {
              return screen.orientation.lock("landscape-secondary");
            });
        };

        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          return document.documentElement.requestFullscreen()
            .catch(function() {})
            .then(requestLock);
        }

        return requestLock();
      }

      function requestUserInteractionForRotation() {
        rotationAttempted = true;
        attemptOrientationLock()
          .then(function() {
            setTimeout(handleOrientationChange, 250);
          })
          .catch(function() {
            showRotationMessage(false);
          });
      }

      function hideAddressBar() {
        if (!isMobile) {
          return;
        }

        try {
          window.scrollTo(0, 1);
          if (isIOS) {
            setTimeout(function() {
              window.scrollTo(0, 0);
            }, 100);
          }
          if (isAndroid) {
            setTimeout(function() {
              window.scrollTo(0, 1);
            }, 300);
          }
        } catch (e) {}
      }

      function resizeUnityCanvas() {
        if (!isMobile || !canvas) {
          return;
        }

        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        container.style.width = window.innerWidth + "px";
        container.style.height = window.innerHeight + "px";
      }

      function handleOrientationChange() {
        if (!isMobile) {
          return;
        }

        if (isLandscapeOrientation()) {
          hideRotationMessage();
          setTimeout(function() {
            hideAddressBar();
            resizeUnityCanvas();
          }, 200);
          return;
        }

        if (!isIOS && !rotationAttempted && screen.orientation && screen.orientation.lock) {
          rotationAttempted = true;
          attemptOrientationLock()
            .then(function() {
              setTimeout(handleOrientationChange, 250);
            })
            .catch(function() {
              showRotationMessage(true);
            });
          return;
        }

        showRotationMessage(!isIOS && !!(screen.orientation && screen.orientation.lock));
      }

      function preventMobileBehaviors() {
        if (!isMobile) {
          return;
        }

        document.addEventListener("contextmenu", function(e) {
          e.preventDefault();
        }, { passive: false });

        var lastTouchEnd = 0;
        document.addEventListener("touchend", function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to help keep control over the canvas
      // rendering size in JavaScript.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (isMobile) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        preventMobileBehaviors();
        setTimeout(handleOrientationChange, 500);

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

#if SHOW_DIAGNOSTICS
        // position the diagnostics icon in the corner on the canvas
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif

      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                loadingBar.style.display = "none";
#if SHOW_DIAGNOSTICS
                diagnostics_icon.onclick = () => {
                  unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMemoryInfo);
                };
#endif
                themeToggleButton.onclick = () => {
                  setTemplateTheme(document.body.classList.contains("unity-night-mode") ? "default" : "night");
                };
                if (isMobile) {
                  setTimeout(function() {
                    resizeUnityCanvas();
                    hideAddressBar();
                    handleOrientationChange();
                  }, 500);
                }
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

      if (enableRotationButton) {
        enableRotationButton.onclick = requestUserInteractionForRotation;
      }

      if (isMobile) {
        window.addEventListener("orientationchange", function() {
          setTimeout(handleOrientationChange, 250);
        });

        window.addEventListener("resize", function() {
          setTimeout(function() {
            if (Math.abs(window.innerHeight - lastWindowHeight) > 50) {
              hideAddressBar();
            }
            lastWindowHeight = window.innerHeight;
            resizeUnityCanvas();
            handleOrientationChange();
          }, 100);
        });

        window.addEventListener("focus", function() {
          setTimeout(handleOrientationChange, 250);
        });

        document.addEventListener("visibilitychange", function() {
          if (!document.hidden) {
            setTimeout(handleOrientationChange, 250);
          }
        });

        document.addEventListener("touchstart", function() {
          setTimeout(hideAddressBar, 300);
        }, { passive: true });
      }

    </script>
  </body>
</html>
